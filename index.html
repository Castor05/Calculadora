<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreMath Engine</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-main);
        }

        .brand-badge {
            font-size: 0.75rem;
            background: #312e81;
            color: #a5b4fc;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #4338ca;
        }

        .input-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 1.1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button.btn-run {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-run:hover {
            background: var(--accent-hover);
        }

        .presets {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .preset-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .preset-btn:hover {
            color: var(--text-main);
            border-color: var(--text-sub);
        }

        .output-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            display: none;
        }

        .output-header {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-sub);
            margin-bottom: 12px;
        }

        .result-box {
            font-size: 1.5rem;
            padding: 16px;
            background: #0f172a;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .steps-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .step-card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
        }

        .step-num {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand">
        <div class="brand-title">CoreMath Engine</div>
        <div class="brand-badge">Symbolic Solver v2.0</div>
    </div>

    <div class="input-panel">
        <div class="input-wrapper">
            <input type="text" id="calcInput" placeholder="Ex: x^2 - x - 6 = 0 ou (x^2 - 1)/(x + 1)">
            <button class="btn-run" onclick="calcular()">Resolver</button>
        </div>
        <div class="presets">
            <button class="preset-btn" onclick="setEq('x^2 - x - 6 = 0')">Equação Quadrática</button>
            <button class="preset-btn" onclick="setEq('(x^2 - 1)/(x + 1)')">Simplificação Álgebra</button>
            <button class="preset-btn" onclick="setEq('3/4 + 6/8')">Operação Fracionária</button>
        </div>
    </div>

    <div id="outputPanel" class="output-panel">
        <div class="output-header">Resultado do Processamento</div>
        <div id="resultDisplay" class="result-box"></div>
        
        <div class="output-header">Etapas da Resolução</div>
        <div id="stepsDisplay" class="steps-wrapper"></div>
    </div>
</div>

<script>
    function setEq(val) {
        document.getElementById('calcInput').value = val;
        calcular();
    }

    async function calcular() {
        const input = document.getElementById('calcInput').value.trim();
        const panel = document.getElementById('outputPanel');
        const resultDisplay = document.getElementById('resultDisplay');
        const stepsDisplay = document.getElementById('stepsDisplay');

        if (!input) return;

        panel.style.display = 'block';
        resultDisplay.innerHTML = "Processando...";
        stepsDisplay.innerHTML = "";

        try {
            const response = await fetch('https://calculadora-universal.onrender.com/calcular', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ expressao: input })
            });

            const data = await response.json();

            if (data.erro) {
                resultDisplay.innerHTML = `<span style="color: #ef4444; font-size: 1rem;">${data.erro}</span>`;
            } else {
                resultDisplay.innerHTML = `\\[${data.resultado}\\]`;
                
                stepsDisplay.innerHTML = data.passos.map((p, i) => `
                    <div class="step-card">
                        <div class="step-num">ETAPA ${i + 1}</div>
                        \\[${p}\\]
                    </div>
                `).join('');

                if (window.MathJax) {
                    MathJax.typesetPromise();
                }
            }
        } catch (e) {
            resultDisplay.innerHTML = `<span style="color: #ef4444; font-size: 1rem;">Erro ao conectar com o servidor Render.</span>`;
        }
    }
</script>

</body>
</html>
