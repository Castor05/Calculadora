<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Universal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0e1117;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        .hero-card {
            background: linear-gradient(135deg, #1e2638 0%, #111827 100%);
            border: 1px solid #2d3748;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .hero-icon {
            font-size: 2.5rem;
            background: #10b98120;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid #10b98140;
        }
        .hero-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #4ef081 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 4px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            background-color: #1a202c;
            border: 1px solid #2d3748;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #4ef081;
        }
        button {
            padding: 12px 24px;
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: linear-gradient(90deg, #059669 0%, #047857 100%);
            transform: translateY(-1px);
        }
        .shortcuts {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .chip {
            background: #1a202c;
            border: 1px solid #2d3748;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .chip:hover {
            border-color: #4ef081;
            color: #fff;
        }
        .result-card {
            background: #1a202c;
            border: 1px solid #10b981;
            border-radius: 12px;
            padding: 20px;
            display: none;
        }
        .result-title {
            color: #4ef081;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }
        .step {
            margin-top: 8px;
            color: #cbd5e1;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero-card">
        <div class="hero-icon">🧮</div>
        <div>
            <div class="hero-title">Calculadora Universal</div>
            <div class="hero-subtitle">Resolução inteligente de expressões, frações e equações.</div>
        </div>
    </div>

    <div class="shortcuts">
        <span class="chip" onclick="setQuery('3|4 + 6|8')">3|4 + 6|8</span>
        <span class="chip" onclick="setQuery('5|9 - 2|5')">5|9 - 2|5</span>
        <span class="chip" onclick="setQuery('5**6')">5**6</span>
        <span class="chip" onclick="setQuery('5!')">5!</span>
        <span class="chip" onclick="setQuery('r3 3 15 8')">r3 3 15 8</span>
    </div>

    <div class="input-group">
        <input type="text" id="calcInput" placeholder="Ex: 3|4 + 6|8 ou r3 3 15 8">
        <button onclick="calcular()">🚀 Calcular</button>
    </div>

    <div id="resultBox" class="result-card">
        <div id="resultText" class="result-title"></div>
        <div id="stepsText"></div>
    </div>
</div>

<script>
    function setQuery(val) {
        document.getElementById('calcInput').value = val;
        calcular();
    }

    async function calcular() {
        const input = document.getElementById('calcInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');
        const stepsText = document.getElementById('stepsText');

        if (!input) return;

        resultBox.style.display = 'block';
        resultText.innerText = "⏳ Calculando...";
        stepsText.innerHTML = "";

        try {
            const response = await fetch('https://calculadora-universal.onrender.com/calcular', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ expressao: input })
            });

            const data = await response.json();

            if (data.erro) {
                resultText.innerText = "❌ Erro";
                stepsText.innerHTML = `<div class="step">${data.erro}</div>`;
            } else {
                resultText.innerText = `🎯 Resultado: ${data.resultado}`;
                stepsText.innerHTML = data.passos.map(p => `<div class="step">• ${p}</div>`).join('');
            }
        } catch (e) {
            resultText.innerText = "❌ Erro de Conexão";
            stepsText.innerHTML = "<div class='step'>Não foi possível se conectar ao servidor do Render. Aguarde alguns segundos se ele estiver iniciando.</div>";
        }
    }
</script>

</body>
</html>
